<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>MAJOB - منصة خدمات</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <section class="calculator">
      <div class="card">
        <label>
          ثمن الخدمة بالدرهم
          <input id="price" type="number" min="0" value="500" />
        </label>
        <label>
          عمولة المنصة
          <select id="commission">
            <option value="5">5%</option>
            <option value="10" selected>10%</option>
            <option value="15">15%</option>
            <option value="20">20%</option>
          </select>
        </label>
        <button class="btn" id="calculate">احسب</button>
      </div>

      <div class="card result">
        <div class="money-row">
          <span>💰 المبلغ المدفوع</span>
          <strong id="total">500 MAD</strong>
        </div>
        <div class="money-row">
          <span>🏢 ربح MAJOB</span>
          <strong id="platform">50 MAD</strong>
        </div>
        <div class="money-row">
          <span>👷 مبلغ العامل</span>
          <strong id="worker">450 MAD</strong>
        </div>
        <p class="card notice">
          في المغرب يمكنك البدء ببوابة دفع محلية مثل CMI أو Payzone، ثم تدفع للعامل لاحقًا بعد خصم العمولة.
        </p>
      </div>
    </section>

    <footer>
      <strong>MAJOB</strong> - منصة خدمات مغربية بنظام عمولة.
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
